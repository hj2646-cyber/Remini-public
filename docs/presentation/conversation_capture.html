<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Remini · 대화 캡쳐 mockup</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --text: #0D1B2A;
      --text-secondary: #4A5568;
      --text-muted: #9AA5B4;
      --bg: #F7FAFC;
      --bg-2: #FFFFFF;
      --bg-3: #EDF2F7;
      --tint: #1A7FC1;
      --tint-light: #E8F4FD;
      --border: #E2E8F0;
      --border-light: #F0F4F8;
      --error: #E53E3E;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 12px;
      -webkit-font-smoothing: antialiased;
    }
    .phone {
      max-width: 420px;
      margin: 0 auto;
      background: var(--bg);
      border-radius: 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .topbar {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 16px;
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
    }
    .topbar-back {
      width: 32px; height: 32px; display: grid; place-items: center;
      border: none; background: transparent; cursor: pointer; border-radius: 8px;
    }
    .topbar-back:hover { background: var(--bg-3); }
    .topbar-title { font-weight: 600; font-size: 15px; flex: 1; }
    .topbar-icon { width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; border-radius: 8px; border: none; background: transparent; }
    .topbar-icon:hover { background: var(--bg-3); }

    .session-info {
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      padding: 16px;
    }
    .session-row { display: flex; align-items: center; gap: 6px; }
    .session-row + .session-row { margin-top: 6px; }
    .session-date {
      font-weight: 600; font-size: 14px; flex: 1; outline: none;
      border-radius: 4px; padding: 2px 4px;
    }
    .session-date:focus { background: var(--tint-light); }
    .session-meta {
      font-size: 13px; color: var(--text-muted);
      outline: none; border-radius: 4px; padding: 2px 4px;
    }
    .session-meta:focus { background: var(--tint-light); }
    .icon-sm { color: var(--tint); }
    .icon-sm.muted { color: var(--text-muted); }

    .summary-box {
      margin: 16px;
      background: var(--tint-light);
      border-radius: 14px;
      padding: 14px;
    }
    .summary-label {
      display: flex; align-items: center; gap: 6px;
      font-weight: 600; font-size: 12px; color: var(--tint);
      margin-bottom: 6px;
    }
    .summary-text {
      font-size: 13px; line-height: 19px; color: var(--text);
      outline: none; border-radius: 4px; padding: 2px 4px;
      min-height: 19px;
    }
    .summary-text:focus { background: rgba(255,255,255,0.6); }
    .summary-text:empty::before {
      content: "대화 요약을 여기에 입력하세요…";
      color: var(--text-muted);
    }

    .messages-header {
      display: flex; align-items: center; gap: 6px;
      padding: 0 16px;
      margin: 4px 0 8px;
      font-weight: 600; font-size: 13px; color: var(--text-muted);
    }
    .messages-bg {
      background: var(--bg-2);
      margin: 0 16px 16px;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 12px;
      min-height: 240px;
    }
    .messages-bg:empty::before {
      content: "+ 버튼으로 메시지를 추가하세요";
      display: block;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      padding: 60px 0;
    }

    .bubble-wrap {
      display: flex; align-items: flex-end; gap: 8px;
      position: relative;
    }
    .bubble-wrap.patient { justify-content: flex-end; }
    .bubble-wrap.assistant { justify-content: flex-start; }
    .avatar {
      width: 28px; height: 28px; border-radius: 14px;
      display: grid; place-items: center; flex-shrink: 0;
      margin-bottom: 16px;
    }
    .avatar.assistant { background: var(--tint-light); color: var(--tint); }
    .avatar.patient { background: var(--tint); color: var(--bg-2); }

    .bubble-content { max-width: 75%; display: flex; flex-direction: column; }
    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px; line-height: 20px;
      outline: none;
      word-wrap: break-word;
    }
    .bubble.patient {
      background: var(--tint);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.assistant {
      background: var(--bg-3);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .bubble:focus {
      box-shadow: 0 0 0 2px rgba(26,127,193,0.3);
    }
    .bubble-time {
      font-size: 10px; color: var(--text-muted);
      margin-top: 3px;
      outline: none;
      border-radius: 4px; padding: 1px 3px;
    }
    .bubble-time:focus { background: var(--tint-light); }
    .bubble-content.patient .bubble-time { text-align: right; }
    .bubble-content.assistant .bubble-time { text-align: left; }

    .bubble-del {
      position: absolute; top: 0; opacity: 0;
      width: 22px; height: 22px;
      border: none; border-radius: 11px;
      background: var(--error); color: #fff;
      cursor: pointer; font-size: 12px; line-height: 1;
      transition: opacity .15s;
    }
    .bubble-wrap.patient .bubble-del { left: -8px; }
    .bubble-wrap.assistant .bubble-del { right: -8px; }
    .bubble-wrap:hover .bubble-del { opacity: 1; }

    .add-bar {
      display: flex; gap: 8px;
      padding: 0 16px 16px;
    }
    .add-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      background: var(--bg-2);
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s, transform .1s;
      font-family: inherit;
    }
    .add-btn:hover { background: var(--bg-3); }
    .add-btn:active { transform: scale(0.98); }
    .add-btn.patient { color: var(--tint); border-color: var(--tint-light); }
    .add-btn.patient:hover { background: var(--tint-light); }
    .add-btn.assistant { color: var(--text-secondary); }

    .toolbar {
      max-width: 420px;
      margin: 12px auto 0;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .tool-btn {
      flex: 1; min-width: 100px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: var(--bg-2);
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-family: inherit;
      color: var(--text-secondary);
    }
    .tool-btn:hover { background: var(--bg-3); }
    .tool-btn.danger { color: var(--error); }

    .hint {
      max-width: 420px;
      margin: 16px auto 0;
      padding: 12px 14px;
      background: var(--tint-light);
      color: var(--tint);
      border-radius: 10px;
      font-size: 12px;
      line-height: 18px;
    }
    .hint b { font-weight: 600; }

    @media print {
      body { background: white; padding: 0; }
      .phone { box-shadow: none; border: none; max-width: 100%; }
      .toolbar, .hint, .add-bar, .bubble-del, .topbar-icon, .topbar-back { display: none !important; }
      .messages-bg { border: none; }
    }
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="topbar">
      <button class="topbar-back" title="뒤로">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="topbar-title">대화 상세</div>
      <button class="topbar-icon" title="삭제">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E53E3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>

    <div class="session-info">
      <div class="session-row">
        <svg class="icon-sm" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <div class="session-date" contenteditable="true">2026년 5월 9일 토요일</div>
      </div>
      <div class="session-row">
        <svg class="icon-sm muted" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <div class="session-meta" contenteditable="true">0개 메시지 · 0개 로드됨</div>
      </div>
    </div>

    <div class="summary-box">
      <div class="summary-label">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        대화 요약
      </div>
      <div class="summary-text" contenteditable="true"></div>
    </div>

    <div class="messages-header">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      대화 내용
    </div>

    <div class="messages-bg" id="messages"></div>

    <div class="add-bar">
      <button class="add-btn assistant" onclick="addBubble('assistant')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        AI 응답
      </button>
      <button class="add-btn patient" onclick="addBubble('patient')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        환자 발화
      </button>
    </div>
  </div>

  <div class="toolbar">
    <button class="tool-btn" onclick="window.print()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      인쇄·PDF
    </button>
    <button class="tool-btn" onclick="exportJSON()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      JSON 저장
    </button>
    <button class="tool-btn danger" onclick="clearAll()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      전체 비우기
    </button>
  </div>

  <div class="hint">
    <b>사용법</b><br>
    · "환자 발화" / "AI 응답" 버튼으로 한 턴씩 추가<br>
    · 말풍선·시간·요약·날짜 모두 클릭해서 직접 수정 가능<br>
    · 메시지 hover → 빨간 ✕ 로 삭제<br>
    · "인쇄·PDF" 로 발표용 캡쳐 / "JSON 저장" 으로 데이터 export<br>
    · 스크린샷: <b>Print Screen</b> 또는 <b>Win + Shift + S</b>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const sessionMeta = document.querySelector('.session-meta');

    function nowTime() {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function updateMeta() {
      const n = messagesEl.querySelectorAll('.bubble-wrap').length;
      sessionMeta.textContent = `${n}개 메시지 · ${n}개 로드됨`;
    }

    function svgPerson() {
      return `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
    }
    function svgChip() {
      return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="2" x2="9" y2="4"/><line x1="15" y1="2" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="22"/><line x1="15" y1="20" x2="15" y2="22"/><line x1="20" y1="9" x2="22" y2="9"/><line x1="20" y1="14" x2="22" y2="14"/><line x1="2" y1="9" x2="4" y2="9"/><line x1="2" y1="14" x2="4" y2="14"/></svg>`;
    }

    function addBubble(role, text = '', time = '') {
      const wrap = document.createElement('div');
      wrap.className = `bubble-wrap ${role}`;

      const avatar = `<div class="avatar ${role}">${role === 'patient' ? svgPerson() : svgChip()}</div>`;
      const content = `
        <div class="bubble-content ${role}">
          <div class="bubble ${role}" contenteditable="true">${text || (role === 'patient' ? '환자 발화 입력...' : 'AI 응답 입력...')}</div>
          <div class="bubble-time" contenteditable="true">${time || nowTime()}</div>
        </div>
      `;
      const del = `<button class="bubble-del" onclick="this.parentElement.remove(); updateMeta();" title="삭제">×</button>`;

      if (role === 'assistant') {
        wrap.innerHTML = avatar + content + del;
      } else {
        wrap.innerHTML = del + content + avatar;
      }
      messagesEl.appendChild(wrap);
      updateMeta();

      // focus + select default text
      const bubble = wrap.querySelector('.bubble');
      setTimeout(() => {
        bubble.focus();
        const range = document.createRange();
        range.selectNodeContents(bubble);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }, 30);
    }

    function clearAll() {
      if (!confirm('전체 메시지를 비울까요? (날짜·요약은 유지)')) return;
      messagesEl.innerHTML = '';
      updateMeta();
    }

    function exportJSON() {
      const date = document.querySelector('.session-date').textContent.trim();
      const summary = document.querySelector('.summary-text').textContent.trim();
      const messages = [];
      messagesEl.querySelectorAll('.bubble-wrap').forEach(w => {
        const role = w.classList.contains('patient') ? 'patient' : 'assistant';
        const content = w.querySelector('.bubble').textContent.trim();
        const timestamp = w.querySelector('.bubble-time').textContent.trim();
        messages.push({ role, content, timestamp });
      });
      const data = { sessionDate: date, summary, messages };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const fname = `conversation_${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.json`;
      a.download = fname;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 시드 (예시 1턴씩)
    addBubble('assistant', '안녕하세요, 오늘은 어떤 이야기 나누고 싶으세요?', nowTime());
    addBubble('patient', '글쎄요... 옛날 생각이 자꾸 나네요.', nowTime());
  </script>
</body>
</html>
