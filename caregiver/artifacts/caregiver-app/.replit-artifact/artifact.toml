kind = "mobile"
previewPath = "/"
title = "보호자 모니터링 앱"
version = "1.0.0"
id = "artifacts/caregiver-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
localPort = 25308
name = "expo"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/caregiver-app run dev"

[services.env]
PORT = "25308"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/caregiver-app", "run", "build"]
run = ["pnpm", "--filter", "@workspace/caregiver-app", "run", "serve"]
